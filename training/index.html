<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Strength Program — Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #060810;
    --surface: #090D18;
    --surface-2: #0C1220;
    --border: rgba(120,175,210,0.10);
    --border-hi: rgba(120,175,210,0.24);
    --text-1: #D8EDF5;
    --text-2: #4A6878;
    --text-3: #243545;
    --blue-solid: #29C4E8;
    --blue-dim: rgba(41,196,232,0.07);
    --blue-glow: rgba(41,196,232,0.14);
    --text-read: #7E9FAE;

    --gutter: clamp(46px, 9vw, 68px);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: 'Chakra Petch', sans-serif;
    min-height: 100dvh;
    padding: 0 clamp(16px, 5vw, 48px) clamp(64px, 10vw, 120px);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(41,196,232,0.05), transparent 55%),
      radial-gradient(circle at 90% 20%, rgba(41,196,232,0.03), transparent 50%);
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  /* ---------- masthead ---------- */

  header {
    padding: clamp(28px, 7vw, 68px) 0 clamp(20px, 4vw, 28px);
  }

  .label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--blue-solid);
    display: block;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(38px, 9vw, 64px);
    letter-spacing: -0.025em;
    line-height: 0.92;
    text-transform: uppercase;
  }

  .sub {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-read);
    margin-top: 12px;
    max-width: 44ch;
  }

  .countdown {
    margin-top: clamp(22px, 4vw, 30px);
    display: flex;
    flex-direction: column;
  }

  .cd-row {
    display: grid;
    grid-template-columns: var(--gutter) 1fr;
    align-items: baseline;
    padding: 9px 0;
    border-top: 1px solid var(--border);
  }

  .cd-row:last-child { border-bottom: 1px solid var(--border); }

  .cd-days {
    font-family: 'Barlow Condensed', sans-serif;
    font-style: italic;
    font-weight: 800;
    font-size: clamp(24px, 5vw, 34px);
    line-height: 0.85;
    letter-spacing: -0.03em;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .cd-row.next .cd-days { color: var(--blue-solid); }

  .cd-meta {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-2);
  }

  .cd-row.next .cd-meta { color: var(--text-read); }

  .cd-name { display: block; }

  .cd-when { color: var(--text-2); }

  .cd-unit {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--text-2);
    display: block;
    margin-top: 4px;
  }

  /* ---------- sticky rail: program switch + live progress ---------- */

  .rail {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0 0;
    margin-bottom: clamp(8px, 3vw, 20px);
    background: linear-gradient(to bottom, var(--bg) 72%, rgba(6,8,16,0.86));
    border-bottom: 1px solid var(--border);
  }

  .tabs { display: flex; }

  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    color: var(--text-2);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 14px 16px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .tab:hover { color: var(--text-1); }
  .tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }

  .tab[aria-selected="true"] {
    color: var(--blue-solid);
    border-bottom-color: var(--blue-solid);
  }

  .gauge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    flex-shrink: 0;
  }

  .gauge-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }

  .gauge-count strong { color: var(--blue-solid); font-weight: 700; }

  .gauge-track {
    width: clamp(56px, 16vw, 120px);
    height: 3px;
    background: var(--text-3);
    overflow: hidden;
  }

  .gauge-fill {
    height: 100%;
    background: var(--blue-solid);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.35s var(--ease);
    box-shadow: 0 0 8px var(--blue-glow);
  }

  /* ---------- exercise rows ---------- */

  .ex {
    display: grid;
    grid-template-columns: var(--gutter) 1fr;
    align-items: start;
    padding: clamp(22px, 4vw, 32px) 0;
    border-bottom: 1px solid var(--border);
  }

  .ex-index {
    font-family: 'Barlow Condensed', sans-serif;
    font-style: italic;
    font-weight: 800;
    font-size: clamp(26px, 5.5vw, 40px);
    line-height: 0.85;
    letter-spacing: -0.03em;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
    user-select: none;
    transition: color 0.2s;
  }

  .ex.done .ex-index { color: var(--blue-solid); }
  .ex.done .ex-name { color: var(--text-2); }
  .ex.done .thumb-strip { opacity: 0.45; }

  .ex-body { min-width: 0; }

  .ex-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: clamp(12px, 3vw, 28px);
  }

  .ex-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: clamp(21px, 3.4vw, 27px);
    line-height: 1.05;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    text-wrap: balance;
    transition: color 0.2s;
  }

  .meta {
    display: inline-block;
    margin-top: 9px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--blue-solid);
    background: var(--blue-dim);
    padding: 4px 9px;
  }

  /* ---------- set boxes ---------- */

  .boxes {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .box {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border-hi);
    background: var(--surface);
    cursor: pointer;
    appearance: none;
    padding: 0;
    position: relative;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-3);
    transition: transform 0.15s var(--ease), background-color 0.15s, border-color 0.15s, color 0.15s;
  }

  .box:hover { border-color: var(--border-hi); color: var(--text-2); background: var(--surface-2); }
  .box:active { transform: scale(0.92); }
  .box:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }

  .box.checked {
    background: var(--blue-dim);
    border-color: var(--blue-solid);
    color: transparent;
    box-shadow: 0 0 0 1px var(--blue-glow) inset, 0 2px 14px -6px var(--blue-glow);
  }

  .box.checked::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--blue-solid);
    clip-path: polygon(20% 52%, 38% 70%, 82% 24%, 92% 34%, 38% 90%, 10% 62%);
    transform: scale(0.82);
  }

  /* ---------- form cues (collapsed by default) ---------- */

  .cues {
    margin-top: 16px;
    border-left: 1px solid var(--border);
    padding-left: 16px;
  }

  .cues summary {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-2);
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    transition: color 0.15s;
  }

  .cues summary::-webkit-details-marker { display: none; }
  .cues summary:hover { color: var(--blue-solid); }
  .cues summary:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }

  .cues summary::before {
    content: "+";
    font-size: 13px;
    line-height: 1;
    color: var(--blue-solid);
  }

  .cues[open] summary::before { content: "\2013"; }

  .cues ol {
    list-style: none;
    counter-reset: cue;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    max-width: 56ch;
  }

  .cues li {
    counter-increment: cue;
    position: relative;
    padding-left: 26px;
    font-size: 15px;
    line-height: 1.65;
    color: var(--text-read);
  }

  .cues li::before {
    content: counter(cue, decimal-leading-zero);
    position: absolute;
    left: 0;
    top: 3px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-3);
  }

  /* ---------- reference frames ---------- */

  .thumb-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    margin-top: 18px;
    padding-bottom: 2px;
    transition: opacity 0.2s;
  }

  .thumb-strip::-webkit-scrollbar { height: 3px; }
  .thumb-strip::-webkit-scrollbar-thumb { background: var(--border-hi); }

  .thumb-wrap {
    position: relative;
    flex: 0 0 clamp(110px, 32vw, 160px);
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-2);
    scroll-snap-align: start;
    display: none;
  }

  .thumb-wrap.loaded { display: block; }

  .thumb-wrap.solo {
    flex: 0 0 clamp(240px, 68vw, 380px);
    aspect-ratio: auto;
  }

  .thumb-wrap.solo .thumb { height: auto; object-fit: contain; }

  .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
    filter: saturate(0.9) contrast(1.05);
    transition: transform 0.25s var(--ease);
  }

  .thumb:hover { transform: scale(1.03); }
  .thumb:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }

  .thumb-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(6,8,16,0.55), transparent 65%),
      rgba(41,196,232,0.06);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .thumb-step {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 1;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-1);
    background: rgba(6,8,16,0.72);
    border: 1px solid var(--border-hi);
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  /* ---------- log ---------- */

  .log {
    margin-top: clamp(44px, 9vw, 76px);
    display: grid;
    grid-template-columns: var(--gutter) 1fr;
    align-items: start;
  }

  .log-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-2);
    padding-top: 4px;
  }

  .history-empty {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-3);
  }

  .history-list { list-style: none; }

  .history-list li {
    display: grid;
    grid-template-columns: 4ch 1fr auto;
    align-items: baseline;
    gap: 14px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
  }

  .history-list li:first-child { border-top: 1px solid var(--border); }

  .history-dow {
    color: var(--blue-solid);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 10px;
  }

  .history-date { color: var(--text-1); font-variant-numeric: tabular-nums; }
  .history-sets { color: var(--text-read); text-align: right; }

  .reset {
    justify-self: start;
    margin-top: 22px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 11px 16px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, transform 0.15s var(--ease);
  }

  .reset:hover { color: var(--text-1); border-color: var(--border-hi); }
  .reset:active { transform: scale(0.97); }
  .reset:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }

  /* ---------- lightbox ---------- */

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(6,8,16,0.94);
    display: none;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 5vw, 48px);
    z-index: 20;
    cursor: zoom-out;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 1px solid var(--border-hi);
  }

  .lightbox-close {
    position: absolute;
    top: clamp(16px, 4vw, 32px);
    right: clamp(16px, 4vw, 32px);
    background: transparent;
    border: 1px solid var(--border-hi);
    color: var(--text-1);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 10px 15px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .lightbox-close:hover { border-color: var(--blue-solid); color: var(--blue-solid); }
  .lightbox-close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }

  /* ---------- narrow ---------- */

  @media (max-width: 560px) {
    .ex-top { flex-direction: column; }
    .boxes { margin-top: 12px; }
    .cues li { font-size: 16px; }
    .log { grid-template-columns: 1fr; gap: 12px; }
    .history-list li { grid-template-columns: 4ch 1fr; }
    .history-sets { grid-column: 2; text-align: left; color: var(--text-2); }
  }

  @media (prefers-reduced-motion: reduce) {
    .thumb, .box, .tab, .reset, .gauge-fill, .ex-index, .ex-name { transition: none; }
    .thumb:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="label">The Senate / Private</span>
      <h1>Strength Program</h1>
      <p class="sub">One box per completed set. Progress saves to this device and logs by date.</p>
      <div class="countdown" id="countdown"></div>
    </header>

    <div class="rail">
      <div class="tabs" id="tabs" role="tablist" aria-label="Program"></div>
      <div class="gauge">
        <span class="gauge-count" aria-live="polite"><strong id="done-count">0</strong>/<span id="total-count">0</span></span>
        <div class="gauge-track"><div class="gauge-fill" id="gauge-fill"></div></div>
      </div>
    </div>

    <main id="list" role="tabpanel" tabindex="0"></main>

    <section class="log">
      <h2 class="log-title">Log</h2>
      <div id="history"></div>
    </section>

    <button class="reset" id="reset-btn" type="button">Reset today</button>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" type="button">Close</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

<script>
  const programs = [
    {
      id: 'physio',
      label: 'Physio',
      exercises: [
        { name: "Single leg elevated bridge", meta: "3×10-12 Each Side", imgBase: "single-leg-elevated-bridge", steps: 2 },
        { name: "Split stance / Bulgarian split squat", meta: "3×10-12 Each Side", imgBase: "bulgarian-split-squat", steps: 3 },
        { name: "Single leg calf raise off step", meta: "3×15-20 Each Side", imgBase: "single-leg-calf-raise", steps: 2 },
        { name: "Aeroplanes with roller on inside knee to wall", meta: "3×10-12 Each Side", imgBase: "aeroplanes-roller-wall", steps: 7 },
        { name: "Banded hip flexion/abduction extension in standing (around the world)", meta: "3×10-12 Each Side", imgBase: "banded-around-the-world", steps: 4 },
        { name: "Plank / side planks", meta: "30-45sec", sets: 1, imgBase: "plank-side-plank", steps: 2 },
      ],
    },
    {
      id: 'chiro',
      label: 'Chiropractor',
      exercises: [
        {
          name: "Bridge floor marching",
          meta: "10 Reps Each Side",
          sets: 1,
          imgBase: "chiro-bridge-floor-marching",
          steps: 1,
          cues: [
            "Lie on your back with your legs bent and feet flat on the floor.",
            "Lift your hips up into a bridge, driving the movement with your buttocks.",
            "March one leg, and then the other, keeping your pelvis up and level throughout the exercise.",
            "Lower your leg and repeat on other side for 10 repetitions each side.",
          ],
        },
        {
          name: "Wounded bug",
          meta: "10 Reps Each Pair · Hold 20sec",
          sets: 1,
          imgBase: "chiro-wounded-bug",
          steps: 1,
          cues: [
            "Start on your hands and knees, with your hands under your shoulders, and knees under your hips.",
            "Make sure your back is flat.",
            "Gently squeeze your pelvic floor and stomach muscles.",
            "Without moving your back, slowly lift one arm out in front, and the opposite leg out behind you. Hold for approximately 20 seconds.",
            "Bring both the arm and leg back down.",
            "Repeat with the other opposite pair.",
            "Keep your back still throughout the movement.",
            "Repeat 10 times with each pair.",
          ],
        },
      ],
    },
  ];

  const events = [
    { date: '2026-10-11', name: 'Nike Melbourne Half Marathon' },
    { date: '2026-11-29', name: 'Run for the Young Marathon' },
  ];

  const stepLetters = "abcdefghijklmnopqrstuvwxyz";
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const LOG_KEY = 'senate-training-log';

  const countdownEl = document.getElementById('countdown');
  const tabsEl = document.getElementById('tabs');
  const list = document.getElementById('list');
  const doneCountEl = document.getElementById('done-count');
  const totalCountEl = document.getElementById('total-count');
  const gaugeFill = document.getElementById('gauge-fill');
  const historyEl = document.getElementById('history');

  // Log shape: { "YYYY-MM-DD": { "<programId>|<exerciseIndex>": <setsCompleted> } }
  function loadLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY)) || {}; }
    catch (e) { return {}; }
  }

  function saveLog(log) {
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
  }

  // Local date, not toISOString — UTC would roll the day over mid-evening in AEST.
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function recordSets(programId, exIndex, count) {
    const log = loadLog();
    const day = log[today()] || (log[today()] = {});
    const key = `${programId}|${exIndex}`;
    if (count > 0) day[key] = count; else delete day[key];
    if (!Object.keys(day).length) delete log[today()];
    saveLog(log);
    renderHistory();
  }

  function setsToday(programId, exIndex) {
    const day = loadLog()[today()];
    return (day && day[`${programId}|${exIndex}`]) || 0;
  }

  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }

  // Fisher-Yates over an LCG seeded by program + date.
  function dailyOrder(program) {
    const items = program.exercises.map((ex, i) => ({ ex, i }));
    let seed = hash(program.id + today());
    for (let n = items.length - 1; n > 0; n--) {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      const j = seed % (n + 1);
      const tmp = items[n]; items[n] = items[j]; items[j] = tmp;
    }
    return items;
  }

  let totalBoxes = 0;
  let activeProgram = programs[0];

  function render(program) {
    activeProgram = program;
    list.innerHTML = '';
    totalBoxes = 0;

    dailyOrder(program).forEach((item, slot) => {
      const ex = item.ex;
      const exIndex = item.i;
      const setCount = ex.sets || 3;
      totalBoxes += setCount;

      const row = document.createElement('div');
      row.className = 'ex';

      const index = document.createElement('div');
      index.className = 'ex-index';
      index.setAttribute('aria-hidden', 'true');
      index.textContent = String(slot + 1).padStart(2, '0');

      const body = document.createElement('div');
      body.className = 'ex-body';

      const top = document.createElement('div');
      top.className = 'ex-top';

      const names = document.createElement('div');
      names.innerHTML = `<h2 class="ex-name">${ex.name}</h2><span class="meta">${ex.meta}</span>`;

      const boxes = document.createElement('div');
      boxes.className = 'boxes';

      const restore = setsToday(program.id, exIndex);

      for (let s = 0; s < setCount; s++) {
        const box = document.createElement('button');
        box.className = 'box' + (s < restore ? ' checked' : '');
        box.type = 'button';
        box.textContent = String(s + 1);
        box.setAttribute('aria-label', `${ex.name} — set ${s + 1}`);
        box.setAttribute('aria-pressed', String(s < restore));
        box.addEventListener('click', () => {
          box.classList.toggle('checked');
          const checked = box.classList.contains('checked');
          box.setAttribute('aria-pressed', String(checked));
          recordSets(program.id, exIndex, boxes.querySelectorAll('.box.checked').length);
          updateProgress();
          updateRowState(row, boxes);
        });
        boxes.appendChild(box);
      }

      top.appendChild(names);
      top.appendChild(boxes);
      body.appendChild(top);
      updateRowState(row, boxes);

      if (ex.cues) {
        const cues = document.createElement('details');
        cues.className = 'cues';
        cues.innerHTML =
          `<summary>Form cues (${ex.cues.length})</summary>` +
          `<ol>${ex.cues.map(c => `<li>${c}</li>`).join('')}</ol>`;
        body.appendChild(cues);
      }

      if (ex.imgBase) {
        const strip = document.createElement('div');
        strip.className = 'thumb-strip';

        for (let s = 0; s < ex.steps; s++) {
          const letter = stepLetters[s];
          const thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap' + (ex.steps === 1 ? ' solo' : '');

          const thumb = document.createElement('img');
          thumb.className = 'thumb';
          thumb.alt = `${ex.name} — step ${letter}`;
          thumb.src = `images/${ex.imgBase}-${letter}.jpg`;
          thumb.tabIndex = 0;
          thumb.addEventListener('load', () => thumbWrap.classList.add('loaded'));
          thumb.addEventListener('error', () => thumbWrap.remove());
          thumb.addEventListener('click', () => openLightbox(thumb.src, thumb.alt));
          thumb.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openLightbox(thumb.src, thumb.alt);
            }
          });

          if (ex.steps > 1) {
            const stepBadge = document.createElement('span');
            stepBadge.className = 'thumb-step';
            stepBadge.textContent = letter;
            thumbWrap.appendChild(stepBadge);
          }

          thumbWrap.appendChild(thumb);
          strip.appendChild(thumbWrap);
        }

        body.appendChild(strip);
      }

      row.appendChild(index);
      row.appendChild(body);
      list.appendChild(row);
    });

    totalCountEl.textContent = totalBoxes;
    updateProgress();
  }

  programs.forEach((program, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-controls', 'list');
    tab.textContent = program.label;
    tab.setAttribute('aria-selected', String(i === 0));
    tab.tabIndex = i === 0 ? 0 : -1;
    tab.addEventListener('click', () => selectTab(i));
    tab.addEventListener('keydown', (e) => {
      const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      const next = (i + step + programs.length) % programs.length;
      selectTab(next);
      tabsEl.querySelectorAll('.tab')[next].focus();
    });
    tabsEl.appendChild(tab);
  });

  function selectTab(index) {
    tabsEl.querySelectorAll('.tab').forEach((t, n) => {
      t.setAttribute('aria-selected', String(n === index));
      t.tabIndex = n === index ? 0 : -1;
    });
    render(programs[index]);
  }

  function updateProgress() {
    const checked = document.querySelectorAll('.box.checked').length;
    doneCountEl.textContent = checked;
    gaugeFill.style.transform = `scaleX(${totalBoxes ? checked / totalBoxes : 0})`;
  }

  function updateRowState(row, boxes) {
    const all = boxes.querySelectorAll('.box').length;
    const checked = boxes.querySelectorAll('.box.checked').length;
    row.classList.toggle('done', all > 0 && checked === all);
  }

  function renderHistory() {
    const log = loadLog();
    const days = Object.keys(log).sort().reverse();

    if (!days.length) {
      historyEl.innerHTML = '<p class="history-empty">Nothing logged yet. Tick a set.</p>';
      return;
    }

    const labels = {};
    programs.forEach(p => { labels[p.id] = p.label; });

    const rows = days.map(day => {
      const byProgram = {};
      Object.keys(log[day]).forEach(key => {
        const pid = key.split('|')[0];
        byProgram[pid] = (byProgram[pid] || 0) + log[day][key];
      });
      const detail = Object.keys(byProgram)
        .map(pid => `${labels[pid] || pid} ${byProgram[pid]}`)
        .join(' · ');
      const parts = day.split('-').map(Number);
      const dow = DOW[new Date(parts[0], parts[1] - 1, parts[2]).getDay()];
      const stamp = day === today() ? 'Today' : `${parts[1]}/${String(parts[2]).padStart(2, '0')}`;
      return `<li><span class="history-dow">${dow}</span><span class="history-date">${stamp}</span><span class="history-sets">${detail}</span></li>`;
    }).join('');

    historyEl.innerHTML = `<ul class="history-list">${rows}</ul>`;
  }

  document.getElementById('reset-btn').addEventListener('click', () => {
    const logged = document.querySelectorAll('.box.checked').length;
    if (logged && !confirm(`Clear ${logged} logged ${logged === 1 ? 'set' : 'sets'} for ${activeProgram.label} today?`)) return;
    document.querySelectorAll('.box.checked').forEach(b => {
      b.classList.remove('checked');
      b.setAttribute('aria-pressed', 'false');
    });
    document.querySelectorAll('.ex.done').forEach(r => r.classList.remove('done'));
    const log = loadLog();
    const day = log[today()];
    if (day) {
      Object.keys(day)
        .filter(k => k.indexOf(activeProgram.id + '|') === 0)
        .forEach(k => delete day[k]);
      if (!Object.keys(day).length) delete log[today()];
      saveLog(log);
    }
    renderHistory();
    updateProgress();
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  let lightboxOpener = null;

  function openLightbox(src, alt) {
    lightboxOpener = document.activeElement;
    lightboxImg.src = src;
    lightboxImg.alt = alt;
    lightbox.classList.add('open');
    document.getElementById('lightbox-close').focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
    if (lightboxOpener) lightboxOpener.focus();
    lightboxOpener = null;
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  function renderCountdown() {
    const now = new Date();
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const upcoming = events
      .map(e => {
        const parts = e.date.split('-').map(Number);
        const when = new Date(parts[0], parts[1] - 1, parts[2]);
        return { name: e.name, when, days: Math.round((when - midnight) / 86400000) };
      })
      .filter(e => e.days >= 0)
      .sort((a, b) => a.days - b.days)
      .slice(0, 2);

    if (!upcoming.length) { countdownEl.innerHTML = ''; return; }

    countdownEl.innerHTML = upcoming.map((e, i) => {
      const stamp = `${DOW[e.when.getDay()]} ${e.when.getDate()} ${MONTHS[e.when.getMonth()]} ${e.when.getFullYear()}`;
      const count = e.days === 0
        ? '<span class="cd-days">Today</span>'
        : `<span class="cd-days">${e.days}</span><span class="cd-unit">${e.days === 1 ? 'Day' : 'Days'}</span>`;
      return `<div class="cd-row${i === 0 ? ' next' : ''}">
        <div>${count}</div>
        <p class="cd-meta"><span class="cd-name">${e.name}</span><span class="cd-when">${stamp}</span></p>
      </div>`;
    }).join('');
  }

  render(programs[0]);
  renderHistory();
  renderCountdown();
  // Page stays open for a whole session; re-check so the count rolls at midnight.
  setInterval(renderCountdown, 60000);
</script>
</body>
</html>
