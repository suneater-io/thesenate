<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Strength Program — Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #060810;
    --surface: #090D18;
    --surface-2: #0C1220;
    --border: rgba(120,175,210,0.10);
    --border-hi: rgba(120,175,210,0.24);
    --text-1: #D8EDF5;
    --text-2: #4A6878;
    --text-3: #243545;
    --blue: 190 100% 55%;
    --blue-solid: #29C4E8;
    --blue-dim: rgba(41,196,232,0.07);
    --blue-glow: rgba(41,196,232,0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: 'Chakra Petch', sans-serif;
    min-height: 100vh;
    padding: clamp(24px, 6vw, 64px) clamp(16px, 5vw, 48px) clamp(64px, 10vw, 120px);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(41,196,232,0.05), transparent 55%),
      radial-gradient(circle at 90% 20%, rgba(41,196,232,0.03), transparent 50%);
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    margin-bottom: clamp(36px, 8vw, 64px);
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  .label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--blue-solid);
    display: block;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(32px, 7vw, 52px);
    letter-spacing: -0.02em;
    line-height: 1;
    text-transform: uppercase;
  }

  .sub {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-2);
    margin-top: 10px;
  }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: clamp(24px, 5vw, 36px);
    border-bottom: 1px solid var(--border);
  }

  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-2);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 12px 18px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .tab:hover { color: var(--text-1); }
  .tab:active { transform: scale(0.97); }
  .tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }

  .tab[aria-selected="true"] {
    color: var(--blue-solid);
    border-bottom-color: var(--blue-solid);
  }

  .exercise {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 22px 0;
    border-bottom: 1px solid var(--border);
  }

  .exercise:first-of-type { padding-top: 0; }

  .exercise-head {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px 24px;
  }

  .thumb-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 2px;
  }

  .thumb-strip::-webkit-scrollbar { height: 4px; }
  .thumb-strip::-webkit-scrollbar-thumb { background: var(--border-hi); }

  .thumb-wrap {
    position: relative;
    flex: 0 0 clamp(110px, 32vw, 160px);
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-2);
    scroll-snap-align: start;
    display: none;
  }

  .thumb-wrap.loaded { display: block; }

  .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
    filter: saturate(0.9) contrast(1.05);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .thumb:hover { transform: scale(1.04); }

  .thumb:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid);
  }

  .thumb-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(6,8,16,0.7), transparent 60%),
      rgba(41,196,232,0.08);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .thumb-step {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 1;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text-1);
    background: rgba(6,8,16,0.7);
    border: 1px solid var(--border-hi);
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .exercise.done .name { color: var(--text-2); }
  .exercise.done .name::after { content: ""; }

  .name {
    display: block;
    font-size: clamp(16px, 2.2vw, 19px);
    font-weight: 500;
    line-height: 1.35;
  }

  .meta {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: var(--blue-solid);
    background: var(--blue-dim);
    border: 1px solid var(--border-hi);
    display: inline-block;
    padding: 4px 10px;
    margin-top: 8px;
  }

  .boxes {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .box {
    width: 34px;
    height: 34px;
    border: 1.5px solid var(--border-hi);
    background: var(--surface);
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
    appearance: none;
    padding: 0;
    position: relative;
  }

  .box:hover { border-color: var(--blue-solid); }

  .box:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid);
  }

  .box:active { transform: scale(0.92); }

  .box.checked {
    background: var(--blue-dim);
    border-color: var(--blue-solid);
    box-shadow: 0 0 0 1px var(--blue-glow) inset, 0 2px 12px -4px var(--blue-glow);
  }

  .box.checked::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--blue-solid);
    clip-path: polygon(20% 52%, 38% 70%, 82% 24%, 92% 34%, 38% 90%, 10% 62%);
    transform: scale(0.9);
  }

  .cues {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
    max-width: 58ch;
  }

  .cues li {
    position: relative;
    padding-left: 18px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-2);
  }

  .cues li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 11px;
    width: 8px;
    height: 1px;
    background: var(--blue-solid);
    opacity: 0.6;
  }

  .thumb-wrap.solo {
    flex: 0 0 clamp(220px, 60vw, 320px);
    aspect-ratio: 3 / 2;
  }

  .log {
    margin-top: clamp(40px, 8vw, 64px);
    border-top: 1px solid var(--border);
    padding-top: 24px;
  }

  .history-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-style: italic;
    font-size: 22px;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .history-empty {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-3);
  }

  .history-list {
    list-style: none;
    display: flex;
    flex-direction: column;
  }

  .history-list li {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
  }

  .history-day { color: var(--text-1); letter-spacing: 0.04em; }
  .history-sets { color: var(--text-2); text-align: right; }

  footer {
    margin-top: clamp(40px, 8vw, 64px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .progress {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-2);
    letter-spacing: 0.04em;
  }

  .progress strong { color: var(--blue-solid); }

  .reset {
    background: transparent;
    border: 1px solid var(--border-hi);
    color: var(--text-2);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 18px;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), color 0.15s, border-color 0.15s;
  }

  .reset:hover { color: var(--text-1); border-color: var(--blue-solid); }
  .reset:active { transform: scale(0.96); }
  .reset:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }

  @media (max-width: 480px) {
    .exercise { grid-template-columns: 1fr; }
    .boxes { justify-content: flex-start; margin-top: 4px; }
    .box { width: 44px; height: 44px; }
  }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(6,8,16,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 5vw, 48px);
    z-index: 10;
    cursor: zoom-out;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 1px solid var(--border-hi);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }

  .lightbox-close {
    position: absolute;
    top: clamp(16px, 4vw, 32px);
    right: clamp(16px, 4vw, 32px);
    background: transparent;
    border: 1px solid var(--border-hi);
    color: var(--text-1);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .lightbox-close:hover { border-color: var(--blue-solid); color: var(--blue-solid); }
  .lightbox-close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue-solid); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="label">The Senate / Private</span>
      <h1>Strength Program</h1>
      <p class="sub">Tap a box per completed set. Tap an image to expand.</p>
    </header>

    <div class="tabs" id="tabs" role="tablist"></div>

    <main id="list"></main>

    <footer>
      <p class="progress"><strong id="done-count">0</strong> / <span id="total-count">0</span> sets logged</p>
      <button class="reset" id="reset-btn" type="button">Reset</button>
    </footer>

    <section class="log" id="history"></section>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" type="button">Close</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

<script>
  const programs = [
    {
      id: 'physio',
      label: 'Physio',
      exercises: [
        { name: "Single leg elevated bridge", meta: "3×10-12 Each Side", imgBase: "single-leg-elevated-bridge", steps: 2 },
        { name: "Split stance / Bulgarian split squat", meta: "3×10-12 Each Side", imgBase: "bulgarian-split-squat", steps: 3 },
        { name: "Single leg calf raise off step", meta: "3×15-20 Each Side", imgBase: "single-leg-calf-raise", steps: 2 },
        { name: "Aeroplanes with roller on inside knee to wall", meta: "3×10-12 Each Side", imgBase: "aeroplanes-roller-wall", steps: 7 },
        { name: "Banded hip flexion/abduction extension in standing (around the world)", meta: "3×10-12 Each Side", imgBase: "banded-around-the-world", steps: 4 },
        { name: "Plank / side planks", meta: "30-45sec", sets: 1, imgBase: "plank-side-plank", steps: 2 },
      ],
    },
    {
      id: 'chiro',
      label: 'Chiropractor',
      exercises: [
        {
          name: "Bridge floor marching",
          meta: "10 Reps Each Side",
          sets: 1,
          imgBase: "chiro-bridge-floor-marching",
          steps: 1,
          cues: [
            "Lie on your back with your legs bent and feet flat on the floor.",
            "Lift your hips up into a bridge, driving the movement with your buttocks.",
            "March one leg, and then the other, keeping your pelvis up and level throughout the exercise.",
            "Lower your leg and repeat on other side for 10 repetitions each side.",
          ],
        },
        {
          name: "Wounded bug",
          meta: "10 Reps Each Pair · Hold 20sec",
          sets: 1,
          imgBase: "chiro-wounded-bug",
          steps: 1,
          cues: [
            "Start on your hands and knees, with your hands under your shoulders, and knees under your hips.",
            "Make sure your back is flat.",
            "Gently squeeze your pelvic floor and stomach muscles.",
            "Without moving your back, slowly lift one arm out in front, and the opposite leg out behind you. Hold for approximately 20 seconds.",
            "Bring both the arm and leg back down.",
            "Repeat with the other opposite pair.",
            "Keep your back still throughout the movement.",
            "Repeat 10 times with each pair.",
          ],
        },
      ],
    },
  ];

  const stepLetters = "abcdefghijklmnopqrstuvwxyz";
  const LOG_KEY = 'senate-training-log';

  const tabsEl = document.getElementById('tabs');
  const list = document.getElementById('list');
  const doneCountEl = document.getElementById('done-count');
  const totalCountEl = document.getElementById('total-count');
  const historyEl = document.getElementById('history');

  // Log shape: { "YYYY-MM-DD": { "<programId>|<exerciseIndex>": <setsCompleted> } }
  function loadLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY)) || {}; }
    catch (e) { return {}; }
  }

  function saveLog(log) {
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
  }

  // Local date, not toISOString — UTC would roll the day over mid-evening in AEST.
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function recordSets(programId, exIndex, count) {
    const log = loadLog();
    const day = log[today()] || (log[today()] = {});
    const key = `${programId}|${exIndex}`;
    if (count > 0) day[key] = count; else delete day[key];
    if (!Object.keys(day).length) delete log[today()];
    saveLog(log);
    renderHistory();
  }

  function setsToday(programId, exIndex) {
    const day = loadLog()[today()];
    return (day && day[`${programId}|${exIndex}`]) || 0;
  }

  let totalBoxes = 0;
  let activeProgram = programs[0];

  function render(program) {
    activeProgram = program;
    list.innerHTML = '';
    totalBoxes = 0;

    program.exercises.forEach((ex, exIndex) => {
      const setCount = ex.sets || 3;
      totalBoxes += setCount;

      const row = document.createElement('div');
      row.className = 'exercise';

      const head = document.createElement('div');
      head.className = 'exercise-head';

      const nameCol = document.createElement('div');
      nameCol.innerHTML = `<span class="name">${ex.name}</span><span class="meta">${ex.meta}</span>`;

      const boxes = document.createElement('div');
      boxes.className = 'boxes';

      const restore = setsToday(program.id, exIndex);

      for (let s = 0; s < setCount; s++) {
        const box = document.createElement('button');
        box.className = 'box' + (s < restore ? ' checked' : '');
        box.type = 'button';
        box.setAttribute('aria-label', `${ex.name} — set ${s + 1}`);
        box.setAttribute('aria-pressed', String(s < restore));
        box.addEventListener('click', () => {
          box.classList.toggle('checked');
          const checked = box.classList.contains('checked');
          box.setAttribute('aria-pressed', String(checked));
          recordSets(program.id, exIndex, boxes.querySelectorAll('.box.checked').length);
          updateProgress();
          updateRowState(row, boxes);
        });
        boxes.appendChild(box);
      }

      head.appendChild(nameCol);
      head.appendChild(boxes);
      row.appendChild(head);
      updateRowState(row, boxes);

      if (ex.cues) {
        const cues = document.createElement('ul');
        cues.className = 'cues';
        cues.innerHTML = ex.cues.map(c => `<li>${c}</li>`).join('');
        row.appendChild(cues);
      }

      if (ex.imgBase) {
        const strip = document.createElement('div');
        strip.className = 'thumb-strip';

        for (let s = 0; s < ex.steps; s++) {
          const letter = stepLetters[s];
          const thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap' + (ex.steps === 1 ? ' solo' : '');

          const stepBadge = document.createElement('span');
          stepBadge.className = 'thumb-step';
          stepBadge.textContent = letter;

          const thumb = document.createElement('img');
          thumb.className = 'thumb';
          thumb.alt = `${ex.name} — step ${letter}`;
          thumb.src = `images/${ex.imgBase}-${letter}.jpg`;
          thumb.tabIndex = 0;
          thumb.addEventListener('load', () => thumbWrap.classList.add('loaded'));
          thumb.addEventListener('error', () => thumbWrap.remove());
          thumb.addEventListener('click', () => openLightbox(thumb.src, thumb.alt));
          thumb.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openLightbox(thumb.src, thumb.alt);
            }
          });

          if (ex.steps > 1) thumbWrap.appendChild(stepBadge);
          thumbWrap.appendChild(thumb);
          strip.appendChild(thumbWrap);
        }

        row.appendChild(strip);
      }

      list.appendChild(row);
    });

    totalCountEl.textContent = totalBoxes;
    updateProgress();
  }

  programs.forEach((program, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.textContent = program.label;
    tab.setAttribute('aria-selected', String(i === 0));
    tab.addEventListener('click', () => {
      tabsEl.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', 'false'));
      tab.setAttribute('aria-selected', 'true');
      render(program);
    });
    tabsEl.appendChild(tab);
  });

  function updateProgress() {
    doneCountEl.textContent = document.querySelectorAll('.box.checked').length;
  }

  function updateRowState(row, boxes) {
    const all = boxes.querySelectorAll('.box').length;
    const checked = boxes.querySelectorAll('.box.checked').length;
    row.classList.toggle('done', all > 0 && checked === all);
  }

  function renderHistory() {
    const log = loadLog();
    const days = Object.keys(log).sort().reverse();

    if (!days.length) {
      historyEl.innerHTML = '<h2 class="history-title">Log</h2><p class="history-empty">No sessions logged yet.</p>';
      return;
    }

    const labels = {};
    programs.forEach(p => { labels[p.id] = p.label; });

    const rows = days.map(day => {
      const byProgram = {};
      Object.keys(log[day]).forEach(key => {
        const pid = key.split('|')[0];
        byProgram[pid] = (byProgram[pid] || 0) + log[day][key];
      });
      const detail = Object.keys(byProgram)
        .map(pid => `${labels[pid] || pid} ${byProgram[pid]}`)
        .join(' · ');
      const total = Object.keys(byProgram).reduce((a, pid) => a + byProgram[pid], 0);
      const stamp = day === today() ? `${day} · today` : day;
      return `<li><span class="history-day">${stamp}</span><span class="history-sets">${detail} — ${total} sets</span></li>`;
    }).join('');

    historyEl.innerHTML = `<h2 class="history-title">Log</h2><ul class="history-list">${rows}</ul>`;
  }

  document.getElementById('reset-btn').addEventListener('click', () => {
    document.querySelectorAll('.box.checked').forEach(b => {
      b.classList.remove('checked');
      b.setAttribute('aria-pressed', 'false');
    });
    document.querySelectorAll('.exercise.done').forEach(r => r.classList.remove('done'));
    const log = loadLog();
    const day = log[today()];
    if (day) {
      Object.keys(day)
        .filter(k => k.indexOf(activeProgram.id + '|') === 0)
        .forEach(k => delete day[k]);
      if (!Object.keys(day).length) delete log[today()];
      saveLog(log);
    }
    renderHistory();
    updateProgress();
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt;
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  render(programs[0]);
  renderHistory();
</script>
</body>
</html>
